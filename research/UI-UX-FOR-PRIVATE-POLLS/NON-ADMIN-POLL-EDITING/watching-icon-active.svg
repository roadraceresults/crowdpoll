<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
  <!-- Watching (active): the same eye as watching-icon.svg, in ink (#1E2422, as
       the pressed bookmark's tag), with the iris filled. The catchlight is cut
       out with a mask, so it shows the card behind it in any theme. -->
  <defs>
    <mask id="watching-catchlight">
      <rect width="24" height="24" fill="#fff"/>
      <circle cx="13.3" cy="10.7" r="1.3" fill="#000"/>
    </mask>
  </defs>
  <path d="M1.8 12C4.6 7.2 8 4.9 12 4.9s7.4 2.3 10.2 7.1C19.4 16.8 16 19.1 12 19.1S4.6 16.8 1.8 12z" fill="none" stroke="#1E2422" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="4.3" fill="#1E2422" mask="url(#watching-catchlight)"/>
</svg>
