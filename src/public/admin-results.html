<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <title>View Results — CrowdPoll Admin</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/m3-tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/tabs.css">
  <link rel="stylesheet" href="/pollCard.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/tooltip-m3.css">
  <link rel="stylesheet" href="/header-tab-bar-m3.css">
  <link rel="stylesheet" href="/header-single-column-m3.css">
  <link rel="stylesheet" href="/header-single-row-m3.css">
  <link rel="stylesheet" href="/header-fixed-m3.css">
  <link rel="stylesheet" href="/back-to-top-m3.css">
  <link rel="stylesheet" href="/footer-m3.css">
</head>
<body>
  <div class="page-decor"></div>
  <div class="page">
    <div class="container">
      <div class="layout">
        <header id="site-header" class="site-header"></header>

        <main>
          <h1 id="resultsTitle" class="question"></h1>
          <p id="resultsSubtitle" class="subtitle"></p>
          <p id="resultsTotals"></p>

          <ul class="admin-choice-list" id="resultsChoices"></ul>

          <section class="admin-field">
            <h2>Voted</h2>
            <ul class="admin-participant-list" id="votedList"></ul>
          </section>
          <section class="admin-field" id="notYetVotedSection">
            <h2>Not Yet Voted</h2>
            <ul class="admin-participant-list" id="notYetVotedList"></ul>
          </section>

          <div class="admin-field-row">
            <a class="btn-header-ghost" id="exportJsonLink">Export JSON</a>
            <a class="btn-header-ghost" id="exportMdLink">Export Markdown</a>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="/m3-ripple.js" defer></script>
  <script src="/tooltip-m3.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/headerFit.js" defer></script>
  <script src="/fixedChrome.js" defer></script>
  <script src="/adminResults.js" defer></script>
  <script src="/backToTopFab.js" defer></script>
</body>
</html>
