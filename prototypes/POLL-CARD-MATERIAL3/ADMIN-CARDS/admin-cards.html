<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Cards (Material 3)</title>
  <!-- REQUIREMENT Use Material 3 For the admin cards: NON-ADMIN-POLL-EDITING/
       admin-cards.html on the 024 Material 3 foundation. The sheets are in
       src/public/admin.html's order: this folder's copies of production's
       styles.css, tabs.css, pollCard.css and site.css, and admin.css with only
       the cards' layout added; the root's M3 files where admin.html loads
       m3-tokens.css, tooltip-m3.css, tabs-modal-m3.css and
       discard-dialog-m3.css (../pollCard-m3.css holds the tokens here); and
       admin-card-m3.css last. Open this file directly; no server is needed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../pollCard-m3.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tabs.css">
  <link rel="stylesheet" href="pollCard.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="../tooltip-m3.css">
  <link rel="stylesheet" href="../TABS-MODAL/tabs-modal-m3.css">
  <link rel="stylesheet" href="../DISCARD-DIALOG/discard-dialog-m3.css">
  <link rel="stylesheet" href="admin-card-m3.css">
  <style>
    /* Prototype chrome only: the Theme picker. Not production markup. */
    .prototype-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:0 0 10px;
      font:500 13px 'Inter', sans-serif; color:var(--muted); }
    .prototype-bar select{ font:inherit; padding:4px 8px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="icon-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
      <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
    </symbol>
    <symbol id="icon-results" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 9h7"/><path d="M7 13h10"/><path d="M7 17h4"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/><path d="M14 11v6"/>
    </symbol>
  </svg>

  <div class="page-decor"></div>
  <div class="page">
    <div class="container">
      <div class="layout">
        <div class="prototype-bar">
          <label for="themePicker">Theme</label>
          <select id="themePicker">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <main>
          <!-- admin.html's back link (013 FR-040), guarded as adminList.js does
               (harness.js). The toolbar keeps its production look in 024. -->
          <div class="admin-toolbar">
            <a href="/" class="admin-back-link" aria-label="Back to the home page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
              </svg>
            </a>
          </div>
          <div class="admin-card-list" id="pollList"></div>
        </main>
      </div>
    </div>
  </div>

  <script src="admin-card-m3.js" defer></script>
  <script src="../tooltip-m3.js" defer></script>
  <script src="adminCard.js" defer></script>
  <script src="harness.js" defer></script>
</body>
</html>
