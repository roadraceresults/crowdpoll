<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Saved Dialog</title>
  <!-- REQUIREMENT Not Saved Dialog Box: the admin page's "Any edits will be
       lost. Continue?" (window.confirm in src/public/adminCard.js) as an M3
       page dialog. It reuses Tabs.modal's markup, so ../TABS-MODAL/'s copy of
       production's modal rules and its M3 layer dress it; discard-dialog-m3.css
       adds the headline and the two actions. Open this file directly; no
       server is needed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tabs.css">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="../pollCard-m3.css">
  <link rel="stylesheet" href="../TABS-MODAL/tabs-modal.css">
  <link rel="stylesheet" href="../TABS-MODAL/tabs-modal-m3.css">
  <link rel="stylesheet" href="discard-dialog-m3.css">
  <style>
    .prototype-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:0 0 6px;
      font:500 13px 'Inter', sans-serif; color:var(--muted); }
    .prototype-bar select{ font:inherit; padding:4px 8px; }
    .prototype-note{ min-height:18px; margin:0 0 12px; font:500 13px 'Inter', sans-serif; color:var(--muted); }

    /* A stand-in for the editing card: one field and the two exits that call
       the dialog in production. Not production markup; the editing card itself
       is not M3 yet. */
    .stand-in{ display:flex; flex-direction:column; gap:12px; max-width:560px; padding:18px;
      border:1px solid var(--line); border-radius:12px; background:var(--paper-raised); color:var(--ink);
      font:400 14px 'Inter', sans-serif; }
    .stand-in-top{ display:flex; align-items:center; gap:12px; }
    .stand-in a.admin-back-link{ display:inline-flex; align-items:center; justify-content:center;
      width:36px; height:36px; border-radius:50%; color:var(--ink); }
    .stand-in a.admin-back-link svg{ width:20px; height:20px; }
    .stand-in label{ font-weight:600; }
    .stand-in textarea{ font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px;
      background:var(--paper); color:var(--ink); resize:vertical; }
    .stand-in-actions{ display:flex; gap:10px; }
    .stand-in-actions button{ font:inherit; padding:6px 14px; }
  </style>
</head>
<body>

<div class="page-decor"></div>

<div class="page">
  <div class="container">
    <div class="layout">

      <div class="prototype-bar">
        <label for="themePicker">Theme</label>
        <select id="themePicker">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <p class="prototype-note" id="prototypeNote" aria-live="polite"></p>

      <main>
        <div class="stand-in">
          <div class="stand-in-top">
            <!-- admin.html's back link (013 FR-040), guarded by adminList.js. -->
            <a href="/" class="admin-back-link" aria-label="Back to the home page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="M12 19l-7-7 7-7"/>
              </svg>
            </a>
            <span>Editing: Which topics should the community meeting cover?</span>
          </div>
          <label for="standInTitle">Title</label>
          <textarea id="standInTitle" rows="2">Which topics should the community meeting cover?</textarea>
          <div class="stand-in-actions">
            <button type="button" id="standInCancel">Cancel</button>
          </div>
        </div>
      </main>

    </div>
  </div>
</div>

<script src="discardDialog.js" defer></script>
<script src="discard-dialog-m3.js" defer></script>
<script src="harness.js" defer></script>
</body>
</html>
