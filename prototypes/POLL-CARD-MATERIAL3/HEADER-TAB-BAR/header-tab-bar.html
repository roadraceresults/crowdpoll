<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrowdPoll Header and Tab Bar</title>
  <!-- REQUIREMENT CrowdPoll Header and Tab Bar: the site header, tab bar and tab
       notice extracted from src/public/index.html, with the Material 3 poll cards
       from the folder above mounted under the tabs. Open this file directly; no
       server is needed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Load order: this folder's copies first, then the card prototype's sheets,
       with the card's Material 3 layer last, as on ../poll-card.html. -->
  <link rel="stylesheet" href="tab-bar.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="../pollCard.css">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="../pollCard-m3.css">
  <!-- The header and tab bar's Material 3 layer: last, because it reads
       ../pollCard-m3.css's tokens and overrides the copies above. -->
  <link rel="stylesheet" href="header-tab-bar-m3.css">
  <!-- REQUIREMENT Use Material 3 For tooltips: M3 plain tooltips in place of title. -->
  <link rel="stylesheet" href="../tooltip-m3.css">
  <style>
    .prototype-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:0 0 18px;
      font:500 13px 'Inter', sans-serif; color:var(--muted); }
    .prototype-bar select{ font:inherit; padding:4px 8px; }
  </style>
</head>
<body class="is-guest">

<div class="page-decor"></div>

<div class="page">
  <div class="container">
    <div class="layout">

      <div class="prototype-bar">
        <label for="sessionPicker">Session</label>
        <select id="sessionPicker">
          <option value="guest-native">Guest (native sign-in)</option>
          <option value="guest-oauth">Guest (OAuth sign-in)</option>
          <option value="member">Member</option>
          <option value="admin">Admin</option>
        </select>
        <label for="themePicker">Theme</label>
        <select id="themePicker">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <label><input type="checkbox" id="cookieToggle"> Show cookie banner</label>
      </div>

      <header id="site-header" class="site-header"></header>

      <div class="tab-bar-wrap">
        <nav class="tab-bar" id="tabBar" aria-label="Poll tabs">
          <button class="tab is-active" type="button" data-tab="trending">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 20.4C8.9 20.4 14.2 17.6 18 12.1l2.4 2.1L21.6 5.2 12.8 7l2.4 2.1c-3.3 4.6-7.7 6.9-13.2 6.9z"/></svg>
            Trending
          </button>
          <button class="tab" type="button" data-tab="newest">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="12" fill="#8093a7"/><path fill="#e8edf2" transform="translate(12 12) skewX(-12) translate(-12 -12)" d="M10.4 5h3.2l-.6 9h-2zM10.5 16h3v3h-3z"/></svg>
            Newest
          </button>
          <button class="tab" type="button" data-tab="private">
            <svg class="tab-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="32" fill="#8093a7"/><circle cx="32" cy="25" r="11" fill="#e8edf2"/><path d="M32 40c-11 0-19 6.5-19 14.5V64h38v-9.5C51 46.5 43 40 32 40z" fill="#e8edf2"/></svg>
            My Private Polls
          </button>
          <button class="tab" type="button" data-tab="favourites">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5l2.94 5.96 6.58.96-4.76 4.64 1.12 6.55L12 17.52l-5.88 3.09 1.12-6.55-4.76-4.64 6.58-.96z" fill="none" stroke="#9AA197" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Favorites
          </button>
          <button class="tab" type="button" data-tab="live">
            <span class="tab-icon tab-icon--live" aria-hidden="true"><span class="live-bars"><i></i><i></i><i></i></span></span>
            Live Results
          </button>
          <button class="tab" type="button" data-tab="search">
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Search
          </button>
        </nav>
        <!-- FIX013: the search box is the header's "Search CrowdPoll" field. -->
        <!-- FIX007: an icon (two arrows chasing round a circle); the words stay
             on the label and tooltip. -->
        <button class="tab-refresh tab-refresh--icon" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
          </svg>
        </button>
      </div>

      <p class="tab-notice" id="tabNotice" hidden></p>

      <!-- Clarification 4c: the Material 3 poll cards, re-mounted for each tab. -->
      <div class="card-grid" id="cardGrid"></div>

    </div>
  </div>
</div>

<script src="../pollCard.js" defer></script>
<script src="../pollCard-m3.js" defer></script>
<script src="../fixtures.js" defer></script>
<script src="header.js" defer></script>
<script src="header-tab-bar-m3.js" defer></script>
<script src="../tooltip-m3.js" defer></script>
<script src="harness.js" defer></script>
</body>
</html>
